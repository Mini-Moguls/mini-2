<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Illustrated Harare Event Hub and Showcase Zones map for Mini Moguls Market Day on Saturday, 12 December 2026 (Venue TBA)">
  
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#111111" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="800" height="520" rx="28" fill="#FFF9EB"/>
  <rect width="800" height="520" rx="28" fill="url(#dots)"/>

  <!-- Decorative Harare avenues / pathways -->
  <path d="M0 140 H800" stroke="#FDE28A" stroke-width="26"/>
  <path d="M0 380 H800" stroke="#FDE28A" stroke-width="26"/>
  <path d="M220 0 V520" stroke="#FDE28A" stroke-width="26"/>
  <path d="M580 0 V520" stroke="#FDE28A" stroke-width="26"/>
  <path d="M0 140 H800 M0 380 H800 M220 0 V520 M580 0 V520" stroke="#111111" stroke-width="2.5" stroke-dasharray="8 8" stroke-opacity="0.35"/>

  <!-- Central Market Day Pavilion Card -->
  <rect x="250" y="155" width="300" height="210" rx="26" fill="#FFFFFF" stroke="#111111" stroke-width="3.5"/>
  <rect x="268" y="173" width="264" height="44" rx="12" fill="#111111"/>
  <text x="400" y="200" text-anchor="middle" font-family="Figtree, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#F4C84A">MINI MOGULS MARKET DAY HUB</text>

  <!-- Pin icon in center -->
  <circle cx="400" cy="262" r="26" fill="#F4C84A" stroke="#111111" stroke-width="3"/>
  <polygon points="388,266 394,252 400,260 406,252 412,266" fill="#111111"/>
  <text x="400" y="314" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#111111">Harare, Zimbabwe</text>
  <text x="400" y="338" text-anchor="middle" font-family="Figtree, sans-serif" font-size="12.5" font-weight="700" fill="#555555">Specific Venue: To Be Announced (TBA)</text>
  <text x="400" y="355" text-anchor="middle" font-family="Figtree, sans-serif" font-size="11.5" font-weight="800" fill="#111111">SAT, 12 DEC 2026 · 10:00 AM – 4:00 PM</text>

  <!-- 4 Corner Showcase Zone Cards -->
  <!-- Top-left: Zone 1 -->
  <g transform="translate(36 32)">
    <rect width="164" height="86" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.8"/>
    <rect x="12" y="12" width="64" height="20" rx="6" fill="#F4C84A"/>
    <text x="44" y="26" text-anchor="middle" font-family="Figtree, sans-serif" font-size="10" font-weight="800" fill="#111111">ZONE A</text>
    <text x="14" y="50" font-family="Figtree, sans-serif" font-size="13" font-weight="800" fill="#111111">Arts, Crafts &amp; Fashion</text>
    <text x="14" y="68" font-family="Figtree, sans-serif" font-size="11" font-weight="600" fill="#555555">Handmade &amp; Wearable Art</text>
  </g>

  <!-- Top-right: Zone 2 -->
  <g transform="translate(600 32)">
    <rect width="164" height="86" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.8"/>
    <rect x="12" y="12" width="64" height="20" rx="6" fill="#F4C84A"/>
    <text x="44" y="26" text-anchor="middle" font-family="Figtree, sans-serif" font-size="10" font-weight="800" fill="#111111">ZONE B</text>
    <text x="14" y="50" font-family="Figtree, sans-serif" font-size="13" font-weight="800" fill="#111111">Young Bakers &amp; Treats</text>
    <text x="14" y="68" font-family="Figtree, sans-serif" font-size="11" font-weight="600" fill="#555555">Bakes, Snacks &amp; Drinks</text>
  </g>

  <!-- Bottom-left: Zone 3 -->
  <g transform="translate(36 402)">
    <rect width="164" height="86" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="2.8"/>
    <rect x="12" y="12" width="64" height="20" rx="6" fill="#F4C84A"/>
    <text x="44" y="26" text-anchor="middle" font-family="Figtree, sans-serif" font-size="10" font-weight="800" fill="#111111">ZONE C</text>
    <text x="14" y="50" font-family="Figtree, sans-serif" font-size="13" font-weight="800" fill="#111111">Tech, Games &amp; Eco</text>
    <text x="14" y="68" font-family="Figtree, sans-serif" font-size="11" font-weight="600" fill="#555555">STEM, Fun &amp; Green Ideas</text>
  </g>

  <!-- Bottom-right: Zone 4 -->
  <g transform="translate(600 402)">
    <rect width="164" height="86" rx="16" fill="#111111" stroke="#111111" stroke-width="2.8"/>
    <rect x="12" y="12" width="88" height="20" rx="6" fill="#F4C84A"/>
    <text x="56" y="26" text-anchor="middle" font-family="Figtree, sans-serif" font-size="10" font-weight="800" fill="#111111">WELCOME DESK</text>
    <text x="14" y="50" font-family="Figtree, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Family &amp; Partner Hub</text>
    <text x="14" y="68" font-family="Figtree, sans-serif" font-size="11" font-weight="600" fill="#F4C84A">Entry: US$5 (TBA)</text>
  </g>
</svg>