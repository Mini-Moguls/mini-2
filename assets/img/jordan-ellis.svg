<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="Families & Supporters — GUIDING EVERY YOUNG MOGUL">
    
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#111111" fill-opacity="0.1"/>
    </pattern>
  </defs>

    <rect width="360" height="420" fill="#FFF9EB"/>
    <rect width="360" height="420" fill="url(#dots)"/>

    <!-- Background sun circle -->
    <circle cx="180" cy="195" r="112" fill="#FDE28A" fill-opacity="0.7"/>

    <!-- Top pill badge -->
    <rect x="40" y="26" width="280" height="32" rx="16" fill="#111111"/>
    <text x="180" y="46" text-anchor="middle" font-family="Figtree, sans-serif" font-size="11" font-weight="800" letter-spacing="1.3" fill="#F4C84A">PARENTS & GUARDIANS</text>

    <!-- Character illustration -->
    
    <g transform="translate(180 225) scale(1.35)">
      <path d="M-22 -8 C-38 -18, -42 -36, -34 -48" fill="none" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/><path d="M-22 -8 C-38 -18, -42 -36, -34 -48" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 -8 C38 -18, 42 -36, 34 -48" fill="none" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/><path d="M22 -8 C38 -18, 42 -36, 34 -48" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
      <!-- Torso / Shirt -->
      <rect x="-24" y="-14" width="48" height="54" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
      <!-- Apron -->
      <path d="M-17 -12 H17 L20 40 H-20 Z" fill="#F4C84A" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-10" y="8" width="20" height="14" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
      <!-- Neck & Head -->
      <rect x="-7" y="-24" width="14" height="14" rx="4" fill="#8D5524" stroke="#111111" stroke-width="3"/>
      <circle cx="0" cy="-38" r="22" fill="#8D5524" stroke="#111111" stroke-width="3"/>
      <path d="M-22 -40 C-22 -60, 22 -60, 22 -40 Z" fill="#111111"/><polygon points="-16,-54 -8,-68 0,-56 8,-68 16,-54" fill="#F4C84A" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Face -->
      <circle cx="-8" cy="-38" r="2.6" fill="#111111"/>
      <circle cx="8" cy="-38" r="2.6" fill="#111111"/>
      <circle cx="-12" cy="-33" r="3.2" fill="#F4C84A" fill-opacity="0.55"/>
      <circle cx="12" cy="-33" r="3.2" fill="#F4C84A" fill-opacity="0.55"/>
      <path d="M-7 -30 Q0 -23 7 -30" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  

    <!-- Props on table -->
    
      <rect x="82" y="258" width="46" height="32" rx="6" fill="#F4C84A" stroke="#111111" stroke-width="2.8"/>
      <rect x="232" y="258" width="46" height="32" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2.8"/>
    

    <!-- Stall Counter Front -->
    <rect x="36" y="290" width="288" height="16" rx="6" fill="#F4C84A" stroke="#111111" stroke-width="3"/>
    <rect x="46" y="306" width="268" height="86" rx="12" fill="#111111"/>
    <text x="180" y="344" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#F4C84A">Families & Supporters</text>
    <text x="180" y="368" text-anchor="middle" font-family="Figtree, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#FFFFFF">GUIDING EVERY YOUNG MOGUL</text>
  </svg>