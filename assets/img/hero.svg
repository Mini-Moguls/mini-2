<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Young entrepreneurs showcasing handmade products, bakes and inventions at Mini Moguls Market Day in Harare">
  
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#111111" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Rounded card backdrop -->
  <rect x="16" y="16" width="608" height="528" rx="40" fill="#FFF9EB" stroke="#111111" stroke-width="3.5"/>
  <rect x="16" y="16" width="608" height="528" rx="40" fill="url(#dots)"/>

  <!-- Warm sunshine halo -->
  <circle cx="320" cy="245" r="165" fill="#FDE28A" fill-opacity="0.65"/>
  <circle cx="490" cy="120" r="38" fill="#F4C84A" stroke="#111111" stroke-width="3"/>

  <!-- Festive bunting flags -->
  <path d="M56 76 Q185 118 320 82 Q455 118 584 76" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <polygon points="95,86 115,91 103,114" fill="#F4C84A" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="150,96 170,98 159,122" fill="#111111"/>
  <polygon points="205,98 225,96 216,122" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="260,92 280,88 272,114" fill="#F4C84A" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="365,89 385,93 374,116" fill="#111111"/>
  <polygon points="420,97 440,99 429,122" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="475,96 495,92 486,118" fill="#F4C84A" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="530,88 550,82 542,108" fill="#111111"/>

  <!-- Ground floor plane -->
  <path d="M40 455 H600" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="64" y="458" width="512" height="28" rx="12" fill="#FDE28A" fill-opacity="0.55"/>

  <!-- Left easel sign: CREATE. SELL. LEARN. -->
  <g transform="translate(92 365)">
    <line x1="-22" y1="88" x2="-8" y2="-35" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="22" y1="88" x2="8" y2="-35" stroke="#111111" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="-36" y="-28" width="72" height="86" rx="10" fill="#111111" stroke="#111111" stroke-width="3"/>
    <rect x="-30" y="-20" width="60" height="20" rx="5" fill="#F4C84A"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Figtree, sans-serif" font-size="9.5" font-weight="800" fill="#111111">12 DEC 2026</text>
    <text x="0" y="14" text-anchor="middle" font-family="Figtree, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">CREATE</text>
    <text x="0" y="28" text-anchor="middle" font-family="Figtree, sans-serif" font-size="9" font-weight="800" fill="#F4C84A">SELL</text>
    <text x="0" y="42" text-anchor="middle" font-family="Figtree, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">LEARN</text>
  </g>

  <!-- Central Market Stall Pavilion -->
  <g transform="translate(335 280)">
    <!-- Support poles -->
    <rect x="-152" y="-90" width="10" height="225" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
    <rect x="142" y="-90" width="10" height="225" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>

    <!-- Three Young Moguls behind the counter -->
    
    <g transform="translate(-88 12) scale(0.92)">
      <path d="M-22 -8 C-38 -18, -42 -36, -34 -48" fill="none" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/><path d="M-22 -8 C-38 -18, -42 -36, -34 -48" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 -6 C34 8, 32 24, 24 32" fill="none" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/>
      <!-- Torso / Shirt -->
      <rect x="-24" y="-14" width="48" height="54" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
      <!-- Apron -->
      <path d="M-17 -12 H17 L20 40 H-20 Z" fill="#F4C84A" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-10" y="8" width="20" height="14" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
      <!-- Neck & Head -->
      <rect x="-7" y="-24" width="14" height="14" rx="4" fill="#8D5524" stroke="#111111" stroke-width="3"/>
      <circle cx="0" cy="-38" r="22" fill="#8D5524" stroke="#111111" stroke-width="3"/>
      <circle cx="-20" cy="-54" r="12" fill="#111111"/><circle cx="20" cy="-54" r="12" fill="#111111"/><path d="M-22 -42 C-20 -60, 20 -60, 22 -42 Z" fill="#111111"/><path d="M-18 -44 Q0 -50 18 -44" fill="none" stroke="#F4C84A" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Face -->
      <circle cx="-8" cy="-38" r="2.6" fill="#111111"/>
      <circle cx="8" cy="-38" r="2.6" fill="#111111"/>
      <circle cx="-12" cy="-33" r="3.2" fill="#F4C84A" fill-opacity="0.55"/>
      <circle cx="12" cy="-33" r="3.2" fill="#F4C84A" fill-opacity="0.55"/>
      <path d="M-7 -30 Q0 -23 7 -30" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  
    
    <g transform="translate(0 4) scale(0.98)">
      <path d="M-22 -8 C-38 -18, -42 -36, -34 -48" fill="none" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/><path d="M-22 -8 C-38 -18, -42 -36, -34 -48" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 -8 C38 -18, 42 -36, 34 -48" fill="none" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/><path d="M22 -8 C38 -18, 42 -36, 34 -48" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
      <!-- Torso / Shirt -->
      <rect x="-24" y="-14" width="48" height="54" rx="14" fill="#111111" stroke="#111111" stroke-width="3"/>
      <!-- Apron -->
      <path d="M-17 -12 H17 L20 40 H-20 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-10" y="8" width="20" height="14" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
      <!-- Neck & Head -->
      <rect x="-7" y="-24" width="14" height="14" rx="4" fill="#8D5524" stroke="#111111" stroke-width="3"/>
      <circle cx="0" cy="-38" r="22" fill="#8D5524" stroke="#111111" stroke-width="3"/>
      <path d="M-22 -40 C-22 -60, 22 -60, 22 -40 Z" fill="#111111"/><polygon points="-16,-54 -8,-68 0,-56 8,-68 16,-54" fill="#F4C84A" stroke="#111111" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Face -->
      <circle cx="-8" cy="-38" r="2.6" fill="#111111"/>
      <circle cx="8" cy="-38" r="2.6" fill="#111111"/>
      <circle cx="-12" cy="-33" r="3.2" fill="#F4C84A" fill-opacity="0.55"/>
      <circle cx="12" cy="-33" r="3.2" fill="#F4C84A" fill-opacity="0.55"/>
      <path d="M-7 -30 Q0 -23 7 -30" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  
    
    <g transform="translate(88 12) scale(0.92)">
      <path d="M-22 -6 C-34 8, -32 24, -24 32" fill="none" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/>
      <path d="M22 -8 C38 -18, 42 -36, 34 -48" fill="none" stroke="#8D5524" stroke-width="10" stroke-linecap="round"/><path d="M22 -8 C38 -18, 42 -36, 34 -48" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
      <!-- Torso / Shirt -->
      <rect x="-24" y="-14" width="48" height="54" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
      <!-- Apron -->
      <path d="M-17 -12 H17 L20 40 H-20 Z" fill="#F4C84A" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-10" y="8" width="20" height="14" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
      <!-- Neck & Head -->
      <rect x="-7" y="-24" width="14" height="14" rx="4" fill="#8D5524" stroke="#111111" stroke-width="3"/>
      <circle cx="0" cy="-38" r="22" fill="#8D5524" stroke="#111111" stroke-width="3"/>
      <path d="M-23 -42 C-22 -62, 22 -62, 23 -42 Z" fill="#F4C84A" stroke="#111111" stroke-width="3"/><path d="M-25 -42 H30" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
      <!-- Face -->
      <circle cx="-8" cy="-38" r="2.6" fill="#111111"/>
      <circle cx="8" cy="-38" r="2.6" fill="#111111"/>
      <circle cx="-12" cy="-33" r="3.2" fill="#F4C84A" fill-opacity="0.55"/>
      <circle cx="12" cy="-33" r="3.2" fill="#F4C84A" fill-opacity="0.55"/>
      <path d="M-7 -30 Q0 -23 7 -30" fill="none" stroke="#111111" stroke-width="2.8" stroke-linecap="round"/>
    </g>
  

    <!-- Awning roof -->
    <path d="M-172 -90 L-148 -138 H148 L172 -90 Z" fill="#111111" stroke="#111111" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Striped awning scallops -->
    <g transform="translate(0 -90)">
      <path d="M-168 0 V18 A21 21 0 0 0 -126 18 V0 Z" fill="#F4C84A" stroke="#111111" stroke-width="3"/>
      <path d="M-126 0 V18 A21 21 0 0 0 -84 18 V0 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
      <path d="M-84 0 V18 A21 21 0 0 0 -42 18 V0 Z" fill="#111111" stroke="#111111" stroke-width="3"/>
      <path d="M-42 0 V18 A21 21 0 0 0 0 18 V0 Z" fill="#F4C84A" stroke="#111111" stroke-width="3"/>
      <path d="M0 0 V18 A21 21 0 0 0 42 18 V0 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
      <path d="M42 0 V18 A21 21 0 0 0 84 18 V0 Z" fill="#111111" stroke="#111111" stroke-width="3"/>
      <path d="M84 0 V18 A21 21 0 0 0 126 18 V0 Z" fill="#F4C84A" stroke="#111111" stroke-width="3"/>
      <path d="M126 0 V18 A21 21 0 0 0 168 18 V0 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
    </g>

    <!-- Header banner on roof -->
    <rect x="-122" y="-128" width="244" height="28" rx="14" fill="#F4C84A" stroke="#111111" stroke-width="2.8"/>
    <text x="0" y="-110" text-anchor="middle" font-family="Figtree, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.2" fill="#111111">MINI MOGULS MARKET DAY</text>

    <!-- Products on counter (Crafts, Cupcakes, Tech Robot, Cash Box) -->
    <!-- Tiered cupcake stand -->
    <g transform="translate(-112 36)">
      <line x1="0" y1="-26" x2="0" y2="8" stroke="#111111" stroke-width="3"/>
      <rect x="-24" y="-6" width="48" height="6" rx="3" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
      <circle cx="-12" cy="-12" r="6" fill="#F4C84A" stroke="#111111" stroke-width="2"/>
      <circle cx="0" cy="-12" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
      <circle cx="12" cy="-12" r="6" fill="#F4C84A" stroke="#111111" stroke-width="2"/>
    </g>
    <!-- Handmade craft jars & price tag -->
    <g transform="translate(-42 36)">
      <rect x="-12" y="-20" width="22" height="28" rx="5" fill="#F4C84A" stroke="#111111" stroke-width="2.5"/>
      <rect x="-9" y="-25" width="16" height="5" rx="2" fill="#111111"/>
      <rect x="16" y="-16" width="18" height="24" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
    </g>
    <!-- Mini robot / STEM invention -->
    <g transform="translate(46 36)">
      <rect x="-14" y="-24" width="28" height="24" rx="6" fill="#FFFFFF" stroke="#111111" stroke-width="2.5"/>
      <circle cx="-5" cy="-12" r="3" fill="#111111"/>
      <circle cx="5" cy="-12" r="3" fill="#111111"/>
      <line x1="0" y1="-24" x2="0" y2="-32" stroke="#111111" stroke-width="2.5"/>
      <circle cx="0" cy="-34" r="4" fill="#F4C84A" stroke="#111111" stroke-width="2"/>
    </g>
    <!-- Cash box -->
    <g transform="translate(112 36)">
      <rect x="-20" y="-18" width="40" height="26" rx="5" fill="#111111"/>
      <rect x="-14" y="-12" width="28" height="10" rx="2" fill="#F4C84A"/>
      <text x="0" y="-4" text-anchor="middle" font-family="Figtree, sans-serif" font-size="8" font-weight="800" fill="#111111">US$</text>
    </g>

    <!-- Stall Counter Table -->
    <rect x="-168" y="44" width="336" height="16" rx="6" fill="#F4C84A" stroke="#111111" stroke-width="3.2"/>
    <rect x="-156" y="60" width="312" height="115" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="3.2"/>
    <rect x="-136" y="76" width="272" height="82" rx="10" fill="#111111"/>
    <text x="0" y="112" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="700" fill="#F4C84A">Big Ideas. Little Moguls.</text>
    <text x="0" y="136" text-anchor="middle" font-family="Figtree, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#FFFFFF">HARARE · AGES 5–18* / 6–18*</text>
  </g>

  <!-- Sparkle stars -->
  <path d="M108 185 L113 198 L126 203 L113 208 L108 221 L103 208 L90 203 L103 198 Z" fill="#F4C84A" stroke="#111111" stroke-width="2.2"/>
  <path d="M558 245 L562 255 L572 259 L562 263 L558 273 L554 263 L544 259 L554 255 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2.2"/>
</svg>